<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one phone-width column, the week's number first, a fixed tab bar at the bottom.
   Copenhagen copper-roof green is the one accent; ochre marks protected budgets and carried overspending.
   No red anywhere. The font ships with the app, so nothing loads from another site. */
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400 800;font-display:swap;
  src:url("fonts/schibsted-grotesk-latin.woff2") format("woff2");}
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface-2:#E7ECE8; --line:#D3DBD6;
  --ink:#132019; --ink-2:#46534C; --ink-3:#6B7871;
  --accent:#00876B; --accent-ink:#FFFFFF; --accent-soft:#D6EDE5;
  --ochre:#B5851F; --ochre-soft:#F2E7CB;
  --spent:#9AA7A0; --focus:#00876B; --scrim:rgba(8,14,11,.42);
  --font:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px; --tabbar:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --surface:#17201D; --surface-2:#1F2A26; --line:#2B3732;
    --ink:#E3EAE6; --ink-2:#A9B6AF; --ink-3:#7D8A84;
    --accent:#2FA88C; --accent-ink:#03130E; --accent-soft:#163A31;
    --ochre:#BD8A22; --ochre-soft:#3A2F15; --spent:#55635D; --focus:#2FA88C; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#17201D; --surface-2:#1F2A26; --line:#2B3732;
  --ink:#E3EAE6; --ink-2:#A9B6AF; --ink-3:#7D8A84;
  --accent:#2FA88C; --accent-ink:#03130E; --accent-soft:#163A31;
  --ochre:#BD8A22; --ochre-soft:#3A2F15; --spent:#55635D; --focus:#2FA88C; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font-family:inherit;color:inherit;}
input,select,textarea{font-size:16px;}
.amt{font-variant-numeric:tabular-nums;}   /* only digit columns: this face widens the thousands dot under tnum */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px;}
[hidden]{display:none!important;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
p{margin:0;}
a{color:var(--accent);}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px));}
.top{display:flex;align-items:center;gap:10px;padding-block:14px 6px;}
.wordmark{font-weight:800;font-size:19px;letter-spacing:-.4px;}
.top .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);border:0;text-decoration:none;}
button.pill{cursor:pointer;}
.pill.ochre{background:var(--ochre-soft);color:var(--ink);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:inline-block;}
.dot.ochre{background:var(--ochre);}
.dot.muted{background:var(--ink-3);}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink-2);}
.pills{display:flex;flex-wrap:wrap;gap:6px;}

.view{display:flex;flex-direction:column;gap:22px;padding-top:8px;}
.sec{display:flex;flex-direction:column;gap:10px;}
.sec-h{display:flex;align-items:baseline;gap:8px;}
.sec-h h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.1px;text-wrap:balance;}
.sec-h .aside{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right;}
.sec-h a.aside,.sec-h button.aside{color:var(--accent);}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;}
.muted{color:var(--ink-3);}
.small{font-size:13px;}
.note{font-size:13.5px;color:var(--ink-2);text-wrap:pretty;}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:16px;font-size:14px;color:var(--ink-2);}

/* hero: the one number */
.hero{padding:18px 0 4px;}
.hero-k{font-size:15px;color:var(--ink-2);font-weight:500;}
.hero-n{display:flex;align-items:baseline;gap:8px;margin:2px 0 14px;}
.hero-n .num{font-size:clamp(56px, 19vw, 84px);font-weight:800;letter-spacing:-3px;line-height:.95;}
.hero-n .unit{font-size:20px;font-weight:600;color:var(--ink-2);}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;height:22px;}
.weekbar .cell{position:relative;border-radius:5px;background:var(--accent-soft);overflow:hidden;}
.weekbar .cell i{position:absolute;top:0;bottom:0;}
.weekbar .cell .c{background:var(--ochre);}
.weekbar .cell .s{background:var(--spent);}
.weekbar .cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:5px;font-size:11.5px;color:var(--ink-3);text-align:center;}
.weekdays .on{color:var(--ink);font-weight:700;}
.hero-note{margin-top:12px;font-size:14px;color:var(--ink-2);text-wrap:pretty;}
.legend-inline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin-top:8px;}
.legend-inline span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:12px;height:8px;border-radius:2px;display:inline-block;}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chip{flex:0 0 auto;background:var(--surface);border-radius:var(--r-md);padding:9px 12px;min-width:118px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;}
.chip .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.chip .v{font-size:13px;color:var(--ink-2);}
.meter{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;}
.meter i{display:block;height:100%;background:var(--ochre);border-radius:2px;}

.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer;}
.row + .row{border-top:1px solid var(--line);}
.row .main,.item .main{flex:1;min-width:0;}
.row .name{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.amt{font-weight:600;font-size:14.5px;white-space:nowrap;}
.amt.in{color:var(--accent);}
.row.pending .name,.row.pending .amt{color:var(--ink-2);font-style:italic;}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);font-style:normal;}
.tag.ochre{background:var(--ochre-soft);color:var(--ink);}
.tag.accent{background:var(--accent-soft);color:var(--ink);}
.tag.ask{background:transparent;box-shadow:inset 0 0 0 1px var(--ochre);color:var(--ink);}

.monthnav{display:flex;align-items:center;gap:6px;}
.monthnav h2{font-size:22px;font-weight:800;letter-spacing:-.6px;margin:0 auto 0 0;}
.navbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:18px;color:var(--ink-2);}
.navbtn:disabled{opacity:.35;cursor:default;}
.bignote{font-size:15px;color:var(--ink-2);text-wrap:pretty;}
.bignote b{color:var(--ink);font-weight:700;}
.chart{position:relative;background:var(--surface);border-radius:var(--r-lg);padding:12px 8px 8px;}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;}
.chart .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);padding:0 8px 6px;}
.chart .legend span{display:inline-flex;align-items:center;gap:6px;}
.ln{width:18px;height:0;border-top:2px solid var(--accent);display:inline-block;}
.ln.last{border-top:2px dashed var(--ink-3);}
.ln.plan{border-top:1px solid var(--ink-3);}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12px;border-radius:8px;padding:6px 9px;line-height:1.35;white-space:nowrap;}
.cats{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 16px;border:0;background:none;width:100%;text-align:left;cursor:pointer;}
.cat + .cat{border-top:1px solid var(--line);}
.cat .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0;}
.cat .v{font-size:13.5px;text-align:right;white-space:nowrap;}
.cat .v .p{color:var(--ink-3);}
.cat .bar{grid-column:1 / -1;position:relative;height:8px;border-radius:4px;background:var(--surface-2);}
.cat .bar .s{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);}
.cat .bar .s.ochre{background:var(--ochre);}
.cat .bar .pl{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;}
.cat .lm{grid-column:1 / -1;font-size:12px;color:var(--ink-3);}
.group-h{padding:10px 16px 2px;font-size:12.5px;font-weight:700;color:var(--ink-3);}
.cat + .group-h{border-top:1px solid var(--line);}

.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fig{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.fig .k{font-size:13px;color:var(--ink-2);font-weight:500;}
.fig .v{font-size:22px;font-weight:800;letter-spacing:-.6px;}
.fig .s{font-size:12px;color:var(--ink-3);}
.track{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;}
.kv + .kv{border-top:1px solid var(--line);}
.kv .k{color:var(--ink-2);}
.kv .v{font-weight:600;text-align:right;}

.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block;}
.btn.quiet{background:var(--surface-2);color:var(--ink);}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);}
.btn.sm{padding:7px 12px;font-size:13px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;}

.card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.card.idea{box-shadow:inset 0 0 0 1.5px var(--accent);}
.card h3{margin:0;font-size:15px;font-weight:700;text-wrap:balance;}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;}
.item + .item{border-top:1px solid var(--line);}
.item .name{display:block;font-weight:600;font-size:14.5px;}
.item .sub{display:block;font-size:12.5px;color:var(--ink-3);}
.item.stack{flex-direction:column;align-items:stretch;gap:6px;}
.due{background:var(--accent-soft);}
.rate{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:2px;gap:2px;flex:none;}
.rate button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
.rate button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line);}
.rate.v1 button.on{background:var(--ochre-soft);}

/* month-end buffer bars */
.mbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:120px;position:relative;margin-top:4px;}
.mbars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;position:relative;z-index:1;}
.mbars .b i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;}
.mbars .b i.low{background:var(--ochre);}
.mbars .b span{font-size:11px;color:var(--ink-3);}
.mbars .b b{font-size:11px;font-weight:600;color:var(--ink-2);}
.mbars .target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);z-index:2;pointer-events:none;}

.sunday{background:var(--surface);border-radius:var(--r-lg);padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
.sunday .line1{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.3;text-wrap:balance;}
.sunday h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink-3);}
.sunday ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;}
textarea.report{width:100%;min-height:260px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--ground);padding:10px;font-size:12.5px;line-height:1.45;resize:vertical;}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar);}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-size:11.5px;font-weight:600;}
.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tabs a.on{color:var(--ink);}
.tabs a.on svg{stroke:var(--accent);}

.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out;}
@keyframes up{from{transform:translateY(24px);opacity:.6;}to{transform:none;opacity:1;}}
.sheet h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 2px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);}
.field input,.field select{border:1px solid var(--line);background:var(--ground);border-radius:var(--r-sm);padding:10px 12px;width:100%;}
.catpick{display:flex;flex-wrap:wrap;gap:6px;}
.catpick button{border:0;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);cursor:pointer;}
.catpick button.on{background:var(--accent);color:var(--accent-ink);}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px));z-index:50;
  background:var(--ink);color:var(--ground);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="wordmark">finance</span>
    <span class="spacer"></span>
    <span class="pill" id="dataPill"></span>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <main id="view" class="view"></main>
</div>

<nav class="tabs" aria-label="Screens"><div class="in">
  <a href="#week" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</a>
  <a href="#month" data-tab="month"><svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>Month</a>
  <a href="#savings" data-tab="savings"><svg viewBox="0 0 24 24"><path d="M4 18c3-1 4-6 8-6s5 3 8 2"/><path d="M4 21h16"/><path d="M12 12V4M9 7l3-3 3 3"/></svg>Savings</a>
  <a href="#buying" data-tab="buying"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Buying</a>
  <a href="#sunday" data-tab="sunday"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Sunday</a>
</div></nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="core.js"></script>
<script src="vault.js"></script>
<script src="ui.js"></script>
</body>
</html>
