<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>finance: bank access</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F4F1; --fg: #17201C; --mute: #5B6761; --card: #FFFFFF; --line: #D9DED9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1513; --fg: #E8ECE9; --mute: #9AA6A0; --card: #18201D; --line: #2A3430; } }
  body { margin: 0; padding: 32px 20px; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--mute); }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0 0 4px; }
  code { display: block; font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; user-select: all; }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Bank access</h1>
  <p id="status">Nothing to show. This page only displays the code the bank sends back after you approve access.</p>
  <div class="box" id="codeBox" hidden>
    <div class="label">Code</div>
    <code id="code"></code>
  </div>
  <div class="box" id="stateBox" hidden>
    <div class="label">Check value (must match the one shown in Terminal)</div>
    <code id="state"></code>
  </div>
  <button id="copy" type="button" hidden>Copy code</button>
</main>
<script src="callback.js"></script>
</body>
</html>
